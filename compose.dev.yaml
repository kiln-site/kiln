# Kiln's development stack: Hearth and a Relay run from this checkout,
# beside MySQL, Valkey, and MinIO. Start it with `pnpm dev:docker`, which
# supplies the environment. It isn't a way to run Kiln: install that with
# https://kiln.site/install, or compose.yaml.
services:
  cache:
    image: ${CACHE_IMAGE:-valkey/valkey:9.1.2-alpine}
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        if command -v valkey-server >/dev/null; then
          exec valkey-server --save "" --appendonly no
        fi
        exec redis-server --save "" --appendonly no
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v valkey-cli >/dev/null; then valkey-cli ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hearth}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: kiln-root
      MYSQL_USER: ${DB_USERNAME:-kiln}
      TZ: America/New_York
    volumes:
      - hearth-mysql:/var/lib/mysql
    labels:
      io.kiln.installation: ${KILN_INSTALLATION_ID:-}
      io.kiln.resource: hearth-database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${KILN_DEV_MYSQL_PORT:-3306}:3306"

  relay:
    image: node:24-alpine
    restart: "no"
    working_dir: /workspace
    depends_on:
      minio-certs:
        condition: service_completed_successfully
    environment:
      KILN_GIT_REPO: ${KILN_GIT_REPO:-}
      KILN_INSTALLATION_ID: ${KILN_INSTALLATION_ID:-}
      KILN_RELAY_BOOTSTRAP_TOKEN: ${KILN_RELAY_BOOTSTRAP_TOKEN:-}
      KILN_RELAY_BOOTSTRAP_TOKEN_FILE: ${KILN_RELAY_BOOTSTRAP_TOKEN_FILE:-}
      KILN_RELAY_HOST: ${KILN_RELAY_HOST:-relay.hearth.orb.local}
      KILN_RELAY_HOST_ACCESS: ${KILN_RELAY_HOST_ACCESS:-true}
      KILN_RELAY_GAME_HOST: ${KILN_RELAY_GAME_HOST:-}
      KILN_RELAY_GAME_PORT_RANGE: ${KILN_RELAY_GAME_PORT_RANGE:-30000-39999}
      KILN_RELAY_CRASH_RETRY_LIMIT: ${KILN_RELAY_CRASH_RETRY_LIMIT:-2}
      KILN_RELAY_CRASH_RETRY_DELAY_SECONDS: ${KILN_RELAY_CRASH_RETRY_DELAY_SECONDS:-5}
      KILN_RELAY_CRASH_STABILITY_SECONDS: ${KILN_RELAY_CRASH_STABILITY_SECONDS:-300}
      KILN_RELAY_BROWSER_SESSIONS_MAX: ${KILN_RELAY_BROWSER_SESSIONS_MAX:-512}
      KILN_RELAY_BROWSER_SESSIONS_PER_INSTANCE_MAX: ${KILN_RELAY_BROWSER_SESSIONS_PER_INSTANCE_MAX:-256}
      KILN_RELAY_BROWSER_SESSIONS_PER_USER_MAX: ${KILN_RELAY_BROWSER_SESSIONS_PER_USER_MAX:-64}
      KILN_RELAY_BROWSER_SESSIONS_PER_USER_INSTANCE_MAX: ${KILN_RELAY_BROWSER_SESSIONS_PER_USER_INSTANCE_MAX:-16}
      KILN_RELAY_BROWSER_PENDING_HANDSHAKES_MAX: ${KILN_RELAY_BROWSER_PENDING_HANDSHAKES_MAX:-64}
      KILN_RELAY_BROWSER_PENDING_HANDSHAKES_PER_IP_MAX: ${KILN_RELAY_BROWSER_PENDING_HANDSHAKES_PER_IP_MAX:-16}
      KILN_RELAY_BROWSER_PENDING_FILE_AUTH_MAX: ${KILN_RELAY_BROWSER_PENDING_FILE_AUTH_MAX:-16}
      KILN_RELAY_BROWSER_SUBLIMITS_ENFORCE: ${KILN_RELAY_BROWSER_SUBLIMITS_ENFORCE:-true}
      KILN_RELAY_BROWSER_OUTBOX_MESSAGES_MAX: ${KILN_RELAY_BROWSER_OUTBOX_MESSAGES_MAX:-256}
      KILN_RELAY_BROWSER_OUTBOX_BYTES_MAX: ${KILN_RELAY_BROWSER_OUTBOX_BYTES_MAX:-2097152}
      KILN_RELAY_BROWSER_FILE_REPLAYS_MAX: ${KILN_RELAY_BROWSER_FILE_REPLAYS_MAX:-65536}
      KILN_RELAY_NAME: ${KILN_RELAY_NAME:-D001-localdev}
      # In a volume, so the inventory helpers this stock image starts share it.
      KILN_RELAY_SYFT_PATH: /opt/kiln-tools/syft
      KILN_RELAY_PROXY: ${KILN_RELAY_PROXY:-none}
      KILN_RELAY_TRAEFIK_IMAGE: ${KILN_RELAY_TRAEFIK_IMAGE:-traefik:v3.7.13}
      KILN_RELAY_ACME_EMAIL: ${KILN_RELAY_ACME_EMAIL:-}
      KILN_RELAY_PORT: ${KILN_RELAY_PORT:-4100}
      KILN_RELAY_HEALTH_PORT: ${KILN_RELAY_HEALTH_PORT:-4101}
      KILN_RELAY_PUBLIC_PORT: ${KILN_RELAY_PUBLIC_PORT:-}
      KILN_RELAY_PUBLIC_URL: ${KILN_RELAY_PUBLIC_URL:-}
      KILN_RELAY_RESOURCE_NAMESPACE: ${KILN_RELAY_RESOURCE_NAMESPACE:-}
      KILN_PLATFORM_BACKUP_KEY: ${KILN_PLATFORM_BACKUP_KEY:-}
      KILN_BACKUP_TIMEOUT: ${KILN_BACKUP_TIMEOUT:-60}
      KILN_RELAY_DISCOVER_PUBLIC_IP: ${KILN_RELAY_DISCOVER_PUBLIC_IP:-true}
      KILN_RELAY_SFTP_PORT: ${KILN_RELAY_SFTP_PORT:-2022}
      KILN_RELAY_TLS_MODE: managed
      KILN_RELAY_TLS_CERT_FILE: ${KILN_RELAY_TLS_CERT_FILE:-}
      KILN_RELAY_TLS_KEY_FILE: ${KILN_RELAY_TLS_KEY_FILE:-}
      MCLOGS_API_URL: ${MCLOGS_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      NODE_ENV: development
      npm_config_store_dir: /root/.local/share/pnpm/store
      # Upgrade-only read path for instances created from the old Relay catalog.
      KILN_BRICKS_CATALOG_URL: file:///workspace/apps/bricks/catalog.yml
      RESTIC_CACERT: /minio-certs/public.crt
      # Full-archive uploads go through Node, not restic.
      NODE_EXTRA_CA_CERTS: /minio-certs/public.crt
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        # The standalone Compose and buildx binaries apps/relay/Dockerfile
        # ships, at the same paths, with no docker CLI.
        if ! docker-compose version 2>/dev/null | grep -q 'v5.5.1$'; then
          case "$$(uname -m)" in
            aarch64) compose_arch=aarch64 buildx_arch=arm64
              compose_sum=732e3a84c1a0f67256ce80bc2598a24546b10ca05f9faa97efceb1171ece2ef7
              buildx_sum=efa38cb7aa7db2dbb9ad049b00b0a9737f66f033626177b5a4e845184ad7ab29 ;;
            *) compose_arch=x86_64 buildx_arch=amd64
              compose_sum=db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
              buildx_sum=982ca20490b45ed1ec8d99795974d3d874a358f75938c9c237305010e6b7e548 ;;
          esac
          mkdir -p /usr/local/libexec/docker/cli-plugins
          wget -qO /usr/local/bin/docker-compose "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-$${compose_arch}"
          wget -qO /usr/local/libexec/docker/cli-plugins/docker-buildx "https://github.com/docker/buildx/releases/download/v0.37.2/buildx-v0.37.2.linux-$${buildx_arch}"
          printf '%s  %s\n%s  %s\n' \
            "$$compose_sum" /usr/local/bin/docker-compose \
            "$$buildx_sum" /usr/local/libexec/docker/cli-plugins/docker-buildx | sha256sum -c -
          chmod +x /usr/local/bin/docker-compose /usr/local/libexec/docker/cli-plugins/docker-buildx
        fi
        # Pin restic to the version shipped in apps/relay/Dockerfile so dev
        # exercises the same CLI/JSON surface as production.
        if ! restic version 2>/dev/null | grep -q '^restic 0.19.1'; then
          arch=$$(uname -m)
          case "$$arch" in aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          attempt=0
          until wget -qO /tmp/restic.bz2 "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_$${arch}.bz2"; do
            attempt=$$((attempt + 1))
            if [ "$$attempt" -ge 5 ]; then echo "restic download failed" >&2; exit 1; fi
            sleep 2
          done
          bunzip2 -c /tmp/restic.bz2 > /usr/local/bin/restic
          chmod +x /usr/local/bin/restic
          rm -f /tmp/restic.bz2
          if ! restic version | grep -q '^restic 0.19.1'; then
            echo "restic install failed" >&2
            exit 1
          fi
        fi
        # Pin Syft to the version apps/relay/Dockerfile ships.
        if ! "$$KILN_RELAY_SYFT_PATH" version 2>/dev/null | grep -q '1.55.0$$'; then
          case "$$(uname -m)" in
            aarch64) syft_arch=arm64
              syft_sum=929bd163db2d7cd2255d3bcb8967208079813d7b46b0c952f7b794d8e2c7d304 ;;
            *) syft_arch=amd64
              syft_sum=bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d ;;
          esac
          wget -qO /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_$${syft_arch}.tar.gz"
          printf '%s  %s\n' "$$syft_sum" /tmp/syft.tar.gz | sha256sum -c -
          mkdir -p "$$(dirname "$$KILN_RELAY_SYFT_PATH")"
          tar -xzf /tmp/syft.tar.gz -C "$$(dirname "$$KILN_RELAY_SYFT_PATH")" syft
          rm -f /tmp/syft.tar.gz
        fi
        corepack enable
        pnpm install --frozen-lockfile --ignore-scripts --filter relay...
        pnpm rebuild esbuild
        if [ ! -f packages/contracts/dist/index.js ] || [ packages/contracts/src/index.ts -nt packages/contracts/dist/index.js ]; then
          pnpm --filter @workspace/contracts exec vp pack
        fi
        exec pnpm --filter relay dev
    healthcheck:
      # The dev image has no native checker, so BusyBox wget probes the same
      # loopback-only plain-HTTP health listener the production image uses.
      # Keep only digits (Relay trims and accepts only digits); empty means 4101.
      test:
        [
          "CMD-SHELL",
          'port=$$(printf ''%s'' "$$KILN_RELAY_HEALTH_PORT" | tr -cd ''0-9''); wget -q -T 2 -O /dev/null "http://127.0.0.1:$${port:-4101}/health"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rw,rslave
      - relay-data:/data
      - .:/workspace
      - type: volume
        source: relay-dev-node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: relay-dev-app-node-modules
        target: /workspace/apps/relay/node_modules
        volume:
          nocopy: true
      - type: volume
        source: relay-dev-contracts-node-modules
        target: /workspace/packages/contracts/node_modules
        volume:
          nocopy: true
      - type: volume
        source: relay-dev-telemetry-node-modules
        target: /workspace/packages/telemetry/node_modules
        volume:
          nocopy: true
      - kiln-dev-pnpm-store:/root/.local/share/pnpm/store
      - minio-certs:/minio-certs:ro
      - relay-dev-tools:/opt/kiln-tools
    ports:
      - "127.0.0.1:${KILN_DEV_SFTP_PORT:-2022}:2022"
    labels:
      io.kiln.installation: ${KILN_INSTALLATION_ID:-}

  hearth:
    image: node:24-alpine
    restart: "no"
    working_dir: /workspace
    depends_on:
      cache:
        condition: service_healthy
      mysql:
        condition: service_healthy
      relay:
        condition: service_healthy
      minio-certs:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-hearth}
      DB_USERNAME: ${DB_USERNAME:-kiln}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_TABLE_PREFIX: ${DB_TABLE_PREFIX:-}
      KILN_ENVIRONMENT: dev
      VITE_REACT_SCAN: ${VITE_REACT_SCAN:-false}
      KILN_GIT_REPO: ${KILN_GIT_REPO:-}
      KILN_BRICKS_CATALOG_URL: file:///workspace/apps/bricks/catalog.yml
      KILN_MARKETING_URL: ${KILN_MARKETING_URL:-}
      KILN_INSTALLATION_ID: ${KILN_INSTALLATION_ID:-}
      CACHE_HOST: ${CACHE_HOST:-cache}
      CACHE_PORT: ${CACHE_PORT:-6379}
      CACHE_USERNAME: ${CACHE_USERNAME:-}
      CACHE_PASSWORD: ${CACHE_PASSWORD:-}
      CACHE_DATABASE: ${CACHE_DATABASE:-0}
      CACHE_TLS: ${CACHE_TLS:-false}
      KILN_ENABLE_SIGNUPS: ${KILN_ENABLE_SIGNUPS:-false}
      KILN_RELAY_BOOTSTRAP_TOKEN: ${KILN_RELAY_BOOTSTRAP_TOKEN:-}
      KILN_RELAY_CONTROL_URL: ${KILN_RELAY_CONTROL_URL:-}
      # Where the dev Relay dials Hearth: its service on the Compose network.
      KILN_RELAY_DIAL_URL: ${KILN_RELAY_DIAL_URL:-http://hearth:3000}
      KILN_RELAY_HOST: ${KILN_RELAY_HOST:-relay.hearth.orb.local}
      KILN_RELAY_PORT: ${KILN_RELAY_PORT:-4100}
      KILN_RELAY_PUBLIC_URL: ${KILN_RELAY_PUBLIC_URL:-}
      KILN_BROWSER_CAPABILITY_CONSOLE_MIN_VERSION: ${KILN_BROWSER_CAPABILITY_CONSOLE_MIN_VERSION:-1}
      KILN_BROWSER_CAPABILITY_RESOURCES_MIN_VERSION: ${KILN_BROWSER_CAPABILITY_RESOURCES_MIN_VERSION:-1}
      KILN_BROWSER_CAPABILITY_FILE_MIN_VERSION: ${KILN_BROWSER_CAPABILITY_FILE_MIN_VERSION:-1}
      KILN_SUPER_USER_EMAIL: ${KILN_SUPER_USER_EMAIL:-}
      KILN_SUPER_USER_PASSWORD: ${KILN_SUPER_USER_PASSWORD:-}
      KILN_URL: ${KILN_URL:-http://localhost:3000}
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:?Set BETTER_AUTH_SECRETS in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      MCLOGS_API_URL: ${MCLOGS_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      NODE_ENV: development
      npm_config_store_dir: /root/.local/share/pnpm/store
      NODE_EXTRA_CA_CERTS: /minio-certs/public.crt
      KILN_GRYPE_PATH: /opt/kiln-tools/grype
      KILN_VULNERABILITY_DB_DIR: /opt/kiln-tools/vulnerability-db
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        # Pin Grype to the version apps/web/Dockerfile ships.
        if ! "$$KILN_GRYPE_PATH" version 2>/dev/null | grep -q '0.121.0$$'; then
          case "$$(uname -m)" in
            aarch64) grype_arch=arm64
              grype_sum=86f570f75ca947ea3dd6486309232bcff6d78e44ba081ae75ab14eab72be3dae ;;
            *) grype_arch=amd64
              grype_sum=64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519 ;;
          esac
          wget -qO /tmp/grype.tar.gz "https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_$${grype_arch}.tar.gz"
          printf '%s  %s\n' "$$grype_sum" /tmp/grype.tar.gz | sha256sum -c -
          mkdir -p "$$(dirname "$$KILN_GRYPE_PATH")"
          tar -xzf /tmp/grype.tar.gz -C "$$(dirname "$$KILN_GRYPE_PATH")" grype
          rm -f /tmp/grype.tar.gz
        fi
        corepack enable
        pnpm install --frozen-lockfile --ignore-scripts --filter web...
        pnpm rebuild esbuild
        if [ ! -f packages/contracts/dist/index.js ] || [ packages/contracts/src/index.ts -nt packages/contracts/dist/index.js ]; then
          pnpm --filter @workspace/contracts exec vp pack
        fi
        exec pnpm --filter web dev --host 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    volumes:
      - .:/workspace
      - type: bind
        source: "${KILN_DEV_ENV_FILE:?Run through pnpm dev:docker}"
        target: /workspace/.env
        read_only: true
      - type: volume
        source: hearth-dev-node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: hearth-dev-web-node-modules
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - type: volume
        source: hearth-dev-contracts-node-modules
        target: /workspace/packages/contracts/node_modules
        volume:
          nocopy: true
      - type: volume
        source: hearth-dev-telemetry-node-modules
        target: /workspace/packages/telemetry/node_modules
        volume:
          nocopy: true
      - type: volume
        source: hearth-dev-ui-node-modules
        target: /workspace/packages/ui/node_modules
        volume:
          nocopy: true
      - kiln-dev-pnpm-store:/root/.local/share/pnpm/store
      - minio-certs:/minio-certs:ro
      - hearth-dev-tools:/opt/kiln-tools
    ports:
      - "127.0.0.1:${KILN_DEV_WEB_PORT:-3000}:3000"
    labels:
      io.kiln.installation: ${KILN_INSTALLATION_ID:-}
      io.kiln.resource: hearth

  minio-certs:
    image: alpine:3.21
    restart: "no"
    volumes:
      - minio-certs:/certs
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /certs/public.crt ]; then
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout /certs/private.key \
            -out /certs/public.crt \
            -subj "/CN=minio" \
            -addext "subjectAltName=DNS:minio,DNS:localhost,IP:127.0.0.1"
          chmod 644 /certs/public.crt
          chmod 600 /certs/private.key
        fi

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: "no"
    depends_on:
      minio-certs:
        condition: service_completed_successfully
    command:
      ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kiln
      MINIO_ROOT_PASSWORD: kilnminiodevpassword
      MINIO_REGION_NAME: us-east-1
    volumes:
      - minio-data:/data
      - minio-certs:/root/.minio/certs:ro

  minio-setup:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio-certs:
        condition: service_completed_successfully
      minio:
        condition: service_started
    volumes:
      - minio-certs:/certs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc --insecure alias set kiln https://minio:9000 kiln kilnminiodevpassword; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then exit 1; fi
          sleep 1
        done
        mc --insecure mb --ignore-existing kiln/kiln-backups

volumes:
  hearth-mysql:
  relay-data:
  relay-dev-node-modules:
  relay-dev-app-node-modules:
  relay-dev-contracts-node-modules:
  relay-dev-telemetry-node-modules:
  relay-dev-tools:
  hearth-dev-tools:
  hearth-dev-node-modules:
  hearth-dev-web-node-modules:
  hearth-dev-contracts-node-modules:
  hearth-dev-telemetry-node-modules:
  hearth-dev-ui-node-modules:
  minio-certs:
  minio-data:
  kiln-dev-pnpm-store:
    external: true
    name: kiln-dev-pnpm-store
