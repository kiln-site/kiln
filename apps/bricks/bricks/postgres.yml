format: kiln.brick/v2
kind: database
type: postgres
metadata:
  id: postgres
  name: PostgreSQL
  revision: 1
  summary: A relational database, with Kiln's table viewer, dumps and restores.
  author: Kiln
  icon: ../icons/postgres.svg
  color: "#5b8fc4"
  tags: [sql]
inputs:
  - key: version
    label: Version
    help: The major version it runs. A redeploy takes that version's newer releases.
    type: select
    options: ["17", "16", "15"]
    default: "17"
deploy:
  type: image
  image: postgres:{{ version }}
  env:
    POSTGRES_DB: "{{ database.name }}"
    POSTGRES_USER: "{{ database.username }}"
    POSTGRES_PASSWORD: "{{ database.password }}"
  ports:
    - { name: postgres, port: 5432 }
  volumes: [/var/lib/postgresql/data]
  # Ready once it serves its network port: the image first initializes on a
  # server that only listens on a local socket.
  ready:
    command: pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
database:
  connection: "postgresql://{{ database.username }}:{{ database.password }}@{{ database.host }}:{{ database.port }}/{{ database.name }}"
