format: kiln.brick/v2
kind: database
type: redis
metadata:
  id: redis
  name: Redis
  summary: An in-memory key-value store that keeps its data on disk.
  author: Kiln
  icon: ../icons/redis.svg
  color: "#d82c20"
  tags: [key-value]
inputs:
  - key: version
    label: Version
    help: The major version it runs. A redeploy takes that version's newer releases.
    type: select
    options: ["8", "7"]
    default: "8"
deploy:
  type: image
  image: redis:{{ version }}
  # Its login is an ACL file Kiln writes into the data volume.
  command: [redis-server, --appendonly, "yes", --aclfile, /data/users.acl]
  ports:
    - { name: redis, port: 6379 }
  volumes: [/data]
  # It answers any connection without a login with NOAUTH, which is enough
  # to know it is serving.
  ready:
    command: redis-cli ping | grep -qE '^(PONG|NOAUTH)'
database:
  connection: "redis://{{ database.username }}:{{ database.password }}@{{ database.host }}:{{ database.port }}"
