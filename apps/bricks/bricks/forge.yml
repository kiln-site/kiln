format: kiln.brick/v2
kind: game-server
type: minecraft
metadata:
  id: forge
  name: Forge
  revision: 2
  summary: The long-standing Minecraft mod loader, installed by Forge's own installer.
  author: Kiln
  icon: ../icons/forge.svg
  color: "#959eef"
  tags: [minecraft, java, mods]
  platforms: [amd64, arm64]
inputs:
  - key: version
    label: Minecraft version
    help: Minecraft release to install the latest Forge for.
    type: text
    default: "26.2"
    pattern: "^[0-9]+(?:\\.[0-9]+){1,2}$"
    max: 32
  - key: forge_version
    label: Forge version
    help: The Forge build to install, like 47.4.23. Leave it empty for the newest one for the Minecraft version.
    type: text
    optional: true
    default: ""
    pattern: "^(?:[0-9]+(?:\\.[0-9]+){1,3})?$"
    max: 32
  - key: java_version
    label: Java version
    help: Follows the Minecraft version; change it when you need another.
    type: select
    options: ["11", "17", "21", "25"]
    default: "21"
    suggest:
      # Which Java each Forge release needs.
      - { when: version, from: "26.1", below: "27", value: "25" }
      - { when: version, from: "1.20.5", below: "1.22", value: "21" }
      - { when: version, from: "1.17", below: "1.20.5", value: "17" }
      - { when: version, from: "1.13", below: "1.17", value: "11" }
      - { when: version, from: "1.1", below: "1.13", value: "8" }
  - key: server_jar_file
    label: Server Jar File
    help: Filename Kiln starts. Forge 1.17 and newer start from its libraries instead.
    type: text
    default: forge.jar
    pattern: "^[A-Za-z0-9][A-Za-z0-9._\\-]{0,123}\\.jar$"
    max: 128
  - key: java_args
    label: Java arguments
    help: Extra JVM flags. Heap size and startup command arguments are managed by Kiln and cannot be set here.
    type: text
    optional: true
    default: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20"
    pattern: "^(?!.*(?:^|\\s)(?:@(?!@)\\S+|-Xm[sx]\\S*|-XX:(?:-UseContainerSupport|-UseCGroupMemoryLimitForHeap|InitialHeapSize|MaxHeapSize|SoftMaxHeapSize|MaxRAMPercentage|MinRAMPercentage|InitialRAMPercentage|MaxRAMFraction|InitialRAMFraction|MinRAMFraction|MaxRAM|VMOptionsFile|Flags)(?:=\\S*)?|--nogui|-jar)(?:\\s|$)).*$"
    max: 2048
deploy:
  type: image
  image: "ghcr.io/kiln-site/bricks-java:{{ java_version }}"
  runtime: "Java {{ java_version }}"
  env:
    KILN_IMPLEMENTATION: forge
    KILN_VERSION: "{{ version }}"
    KILN_ARTIFACT_URL: "https://mcjarfiles.com/api/get-jar/modded/forge/{{ version }}"
    # A Forge version pins the build, from Forge's own Maven.
    KILN_ARTIFACT_BUILD: "{{ forge_version }}"
    KILN_ARTIFACT_BUILD_URL: "https://maven.minecraftforge.net/net/minecraftforge/forge/{{ version }}-{{ forge_version }}/forge-{{ version }}-{{ forge_version }}-installer.jar"
    # The download is Forge's installer; the Ember runs it once.
    KILN_ARTIFACT_INSTALLER: forge
    KILN_ARTIFACT_FILE: "{{ server_jar_file }}"
    KILN_INSTALLATION_MARKER: .kiln-ember-installed
    KILN_SERVER_KIND: minecraft
    KILN_JAVA_ARGS: "{{ java_args }}"
    KILN_JAVA_MAX_RAM_PERCENTAGE: "75.0"
    MIN_RAM: 512M
  # The whole container's limit; Java uses up to 75% of it for its heap.
  memory: 4G
  pids: 1024
  volumes: [/server]
  ports:
    - { name: game, port: 25565 }
  ready:
    log: [")! For help, type "]
game-server:
  game: Minecraft
  stop: [stop, /stop]
