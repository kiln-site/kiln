format: kiln.brick/v2
kind: app
metadata:
  id: docker-image
  name: Docker image
  revision: 2
  summary: Runs an image from a registry, and says when a newer one is out.
  author: Kiln
  icon: ../icons/docker.svg
  color: "#4a9be8"
  tags: [docker]
inputs:
  - key: image
    label: Image
    help: Where it is pulled from, with its tag, such as ghcr.io/acme/site:latest.
    type: text
    max: 255
  - key: port
    label: Web port
    help: The port its website answers on, if it has one. Kiln routes its address there.
    type: number
    optional: true
    min: 1
    max: 65535
deploy:
  type: image
  image: "{{ image }}"
  ports:
    - name: web
      port: "{{ port }}"
