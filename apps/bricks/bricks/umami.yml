format: kiln.brick/v2
kind: group
metadata:
  id: umami
  name: Umami
  revision: 5
  summary: Privacy-focused web analytics, with a PostgreSQL database of its own.
  author: Kiln
  icon: ../icons/umami.svg
  color: "#8a8f98"
  tags: [analytics]
  links:
    homepage: "https://umami.is"
    source: "https://github.com/umami-software/umami"
    docs: "https://umami.is/docs"
# Umami makes its first account itself (admin, with the password umami),
# to change at first sign-in.
inputs:
  - key: app_secret
    label: App secret
    help: Signs its sessions. Kiln makes one when it is installed.
    type: secret
    generate: true
group:
  members:
    database:
      brick: postgres
    web:
      kind: app
      deploy:
        type: image
        image: ghcr.io/umami-software/umami:3.4.1
        env:
          APP_SECRET: "{{ app_secret }}"
        ports:
          - name: web
            port: 3000
        # Its image has no health check of its own. This answers once it
        # serves, which is after it has set up its database.
        ready:
          command: curl -fsS -o /dev/null http://127.0.0.1:3000/api/heartbeat
      connect:
        database:
          DATABASE_URL: "{{ connection }}"
