format: kiln.brick/v1
metadata:
  id: fabric
  name: Fabric
  description: Minimal Minecraft mod-loader runtime with automatic provisioning.
  game: Minecraft
  author: Kiln
  tags: [minecraft, java, mods]
variables:
  version:
    type: string
    label: Minecraft version
    description: Fabric-compatible Minecraft release to install.
    required: true
    default: "26.2"
    rules: { pattern: "^[0-9]+(?:\\.[0-9]+){1,2}$", maxLength: 32 }
  memory:
    type: string
    label: Container memory
    description: Total memory limit; Java uses up to 75% for its heap.
    required: true
    default: 2G
    rules: { pattern: "^[0-9]+[MG]$", maxLength: 12 }
  java_version:
    type: string
    label: Java version
    description: Recommended JDK is selected from the Minecraft version; override it when needed.
    required: true
    default: "21"
    rules: { pattern: "^(?:11|17|21|25)$", maxLength: 2 }
  server_jar_file:
    type: string
    label: Server Jar File
    description: Filename Kiln downloads and starts.
    required: true
    default: fabric.jar
    rules: { pattern: "^[A-Za-z0-9][A-Za-z0-9._\\-]{0,123}\\.jar$", maxLength: 128 }
  java_args:
    type: string
    label: Java arguments
    description: Extra JVM flags. Heap size and startup command arguments are managed by Kiln and cannot be set here.
    required: false
    default: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20"
    rules: { maxLength: 2048, pattern: "^(?!.*(?:^|\\s)(?:@(?!@)\\S+|-Xm[sx]\\S*|-XX:(?:-UseContainerSupport|-UseCGroupMemoryLimitForHeap|InitialHeapSize|MaxHeapSize|SoftMaxHeapSize|MaxRAMPercentage|MinRAMPercentage|InitialRAMPercentage|MaxRAMFraction|InitialRAMFraction|MinRAMFraction|MaxRAM|VMOptionsFile|Flags)(?:=\\S*)?|--nogui|-jar)(?:\\s|$)).*$" }
runtime:
  image: "ghcr.io/kiln-site/bricks-java:{{ variables.java_version }}"
  name: "Java {{ variables.java_version }}"
  environment:
    KILN_IMPLEMENTATION: fabric
    KILN_VERSION: "{{ variables.version }}"
    KILN_ARTIFACT_URL: "https://mcjarfiles.com/api/get-jar/modded/fabric/{{ variables.version }}"
    KILN_ARTIFACT_FILE: "{{ variables.server_jar_file }}"
    KILN_INSTALLATION_MARKER: .kiln-ember-installed
    KILN_SERVER_KIND: minecraft
    KILN_JAVA_ARGS: "{{ variables.java_args }}"
    KILN_JAVA_MAX_RAM_PERCENTAGE: "75.0"
    MIN_RAM: 512M
  resources:
    memory: "{{ variables.memory }}"
    memoryReservation: "{{ variables.memory }}"
    pids: 512
  storage: { mount: /server }
console:
  stopCommands: [stop, /stop]
network:
  mode: minecraft-backend
  primaryPort: game
  hostname: "{{ variables.version }}.{{ brick.id }}"
  ports:
    - { name: game, container: 25565, protocol: tcp }
constraints:
  architectures: [amd64, arm64]
