format: kiln.brick/v1
metadata:
  id: velocity
  name: Velocity
  description: Modern Minecraft proxy running on Kiln's standard Java Ember.
  game: Minecraft
  author: Kiln
  tags: [minecraft, java]
variables:
  version:
    type: string
    label: Velocity version
    description: Velocity release to install.
    required: true
    default: "4.0.0"
    rules: { pattern: "^[0-9]+(?:\\.[0-9]+){1,3}$", maxLength: 32 }
  memory:
    type: string
    label: Container memory
    description: Total memory limit; Java uses up to 75% for its heap.
    required: true
    default: 1G
    rules: { pattern: "^[0-9]+[MG]$", maxLength: 12 }
  java_version:
    type: string
    label: Java version
    description: JDK release used to run the proxy.
    required: true
    default: "21"
    rules: { pattern: "^(?:11|17|21|25)$", maxLength: 2 }
  server_jar_file:
    type: string
    label: Server Jar File
    description: Filename Kiln downloads and starts.
    required: true
    default: velocity.jar
    rules: { pattern: "^[A-Za-z0-9][A-Za-z0-9._\\-]{0,123}\\.jar$", maxLength: 128 }
  java_args:
    type: string
    label: Java arguments
    description: Extra JVM flags. Heap size and startup command arguments are managed by Kiln and cannot be set here.
    required: false
    default: "-XX:+UseG1GC -XX:G1HeapRegionSize=4M -XX:+UnlockExperimentalVMOptions -XX:+ParallelRefProcEnabled -XX:+AlwaysPreTouch -XX:MaxInlineLevel=15"
    rules: { maxLength: 2048, pattern: "^(?!.*(?:^|\\s)(?:@(?!@)\\S+|-Xm[sx]\\S*|-XX:(?:-UseContainerSupport|-UseCGroupMemoryLimitForHeap|InitialHeapSize|MaxHeapSize|SoftMaxHeapSize|MaxRAMPercentage|MinRAMPercentage|InitialRAMPercentage|MaxRAMFraction|InitialRAMFraction|MinRAMFraction|MaxRAM|VMOptionsFile|Flags)(?:=\\S*)?|--nogui|-jar)(?:\\s|$)).*$" }
runtime:
  image: "ghcr.io/kiln-site/bricks-java:{{ variables.java_version }}"
  name: "Java {{ variables.java_version }}"
  environment:
    KILN_IMPLEMENTATION: velocity
    KILN_VERSION: "{{ variables.version }}"
    KILN_ARTIFACT_URL: "https://mcjarfiles.com/api/get-jar/proxies/velocity/{{ variables.version }}"
    KILN_ARTIFACT_FILE: "{{ variables.server_jar_file }}"
    KILN_INSTALLATION_MARKER: .kiln-ember-installed
    KILN_SERVER_KIND: application
    KILN_SERVER_ARGS: ""
    KILN_JAVA_ARGS: "{{ variables.java_args }}"
    KILN_JAVA_MAX_RAM_PERCENTAGE: "75.0"
    MIN_RAM: 512M
  resources:
    memory: "{{ variables.memory }}"
    memoryReservation: "{{ variables.memory }}"
    pids: 512
  storage: { mount: /server }
console:
  stopCommands: [end, /end, shutdown, /shutdown, stop, /stop]
network:
  mode: minecraft-backend
  primaryPort: game
  hostname: "{{ brick.id }}"
  ports:
    - { name: game, container: 25565, protocol: tcp }
constraints:
  architectures: [amd64, arm64]
