packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false

allowBuilds:
  "@prisma/client": false
  better-sqlite3: false
  esbuild: true
  lightningcss: true
  msw: false
  unrs-resolver: true

patchedDependencies:
  "@codemirror/merge@6.12.2": patches/@codemirror__merge@6.12.2.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
overrides:
  # Web and Relay pin the OpenTelemetry API; a second copy splits vitest into
  # two instances, and @effect/vitest then loses the current suite.
  "@opentelemetry/api": 1.9.0
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
onlyBuiltDependencies:
  - bun
