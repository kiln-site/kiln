# Kiln on one machine with Compose: a Relay in platform mode, which installs
# Hearth, its MySQL database, and a Valkey cache beside itself, pairs with
# that Hearth, and keeps them running and updated. It's what
# https://kiln.site/install runs, and the installer is the easier way to it.
#
#   cp .env.example .env    # then set KILN_URL
#   docker compose up -d
#   docker exec kiln-relay kiln-relay platform setup-url
#
# The last prints the link that creates the administrator. Add more machines
# from Hearth's Add Relay dialog. Any setting in docs/self-hosting.md can go
# in .env; the Relay reads all of it.
#
# Coming from Kiln's old compose.yaml, which ran Hearth, MySQL, and Valkey as
# services of their own? This isn't an upgrade of that stack: see "From
# Kiln's old compose.yaml" in docs/self-hosting.md first. The service isn't
# called `relay`, so pulling this and running `docker compose up -d` leaves
# the old stack running, and this Relay stops on a port the old one holds.
services:
  kiln-relay:
    image: ${KILN_IMAGE_PREFIX:-ghcr.io/kiln-site}/relay:${KILN_IMAGE_TAG:-latest}
    # The installer's names, so it and Kiln's recovery steps find this Relay.
    container_name: kiln-relay
    restart: unless-stopped
    env_file: .env
    environment:
      KILN_RELAY_MODE: platform
      KILN_RELAY_CONTAINER: kiln-relay
      # Inside the container, whatever .env says: KILN_SFTP_PORT moves the
      # host's side.
      KILN_RELAY_SFTP_PORT: "2022"
      KILN_URL: ${KILN_URL:?Set KILN_URL in .env to where people will open Kiln}
      KILN_PLATFORM_PROXY: ${KILN_PLATFORM_PROXY:-traefik}
      KILN_PLATFORM_HEARTH_PORT: ${KILN_PLATFORM_HEARTH_PORT:-3000}
      KILN_PLATFORM_HEARTH_BIND: ${KILN_PLATFORM_HEARTH_BIND:-}
      KILN_RELAY_GAME_HOST: ${KILN_RELAY_GAME_HOST:-}
      KILN_RELAY_ACME_CA_SERVER: ${KILN_RELAY_ACME_CA_SERVER:-}
      KILN_RELAY_RESOURCE_NAMESPACE: ${KILN_RELAY_RESOURCE_NAMESPACE:-}
      KILN_GIT_REPO: ${KILN_GIT_REPO:-}
    ports:
      - "${KILN_SFTP_PORT:-2022}:2022"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kiln-relay-data:/data

volumes:
  # The installation: the Relay's state, Kiln's generated secrets, and the
  # record of what it installed.
  kiln-relay-data:
    name: kiln-relay-data
