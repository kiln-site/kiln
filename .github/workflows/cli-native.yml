name: Native CLI checks

on:
  pull_request:
    paths:
      - apps/cli/**
      - packages/contracts/**
      - .github/workflows/cli-native.yml
      - .github/workflows/build-cli.yml
      - .github/workflows/nightly-release.yml
      - .github/workflows/publish-cli.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native CLI (${{ matrix.runner }})
    runs-on: >-
      ${{ (matrix.runner == 'ubuntu-24.04' && vars.BUILD_RUNNER_AMD64)
          || (matrix.runner == 'ubuntu-24.04-arm' && vars.BUILD_RUNNER_ARM64)
          || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-15,
            macos-15-intel,
            windows-2025,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          node-version-file: .node-version
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile", "--filter", "kiln-cli..."]
      - name: Build and exercise native installs and updates
        shell: bash
        run: |
          # Execute package scripts without loading configs for uninstalled workspaces.
          vp exec -F kiln-cli -- bun run build
          vp exec -F kiln-cli -- bun run test:native
      # The only check against the real Keychain / Credential Manager. Linux has
      # no native credential manager, so the CLI uses its file fallback there.
      - name: Use a temporary unlocked keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Isolate the test from the runner's login keychain and avoid
          # unlock prompts; the CLI stores into the default keychain.
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" kiln-cli-e2e.keychain
          security set-keychain-settings kiln-cli-e2e.keychain
          security unlock-keychain -p "$password" kiln-cli-e2e.keychain
          # Keep the existing search list (runner keychain paths have no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s kiln-cli-e2e.keychain \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s kiln-cli-e2e.keychain
      - name: Store, read, and delete a credential in the system store
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        # The binary was built above; test:credential-store would rebuild it.
        run: vp exec -F kiln-cli -- node scripts/credential-store-e2e.mjs
      - name: Remove the temporary keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security default-keychain -d user -s login.keychain || true
          security delete-keychain kiln-cli-e2e.keychain || true
