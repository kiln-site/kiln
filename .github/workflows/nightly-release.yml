name: Nightly release

on:
  push:
  workflow_dispatch:

concurrency:
  group: kiln-release-line
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  code:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml

  config:
    if: github.ref_name == github.event.repository.default_branch && vars.PUBLISH_IMAGES == 'true'
    uses: ./.github/workflows/release-config.yml

  images:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hearth
            dockerfile: apps/web/Dockerfile
          - component: relay
            dockerfile: apps/relay/Dockerfile
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.component }}
      image: ${{ needs.config.outputs.prefix }}/${{ matrix.component }}
      dockerfile: ${{ matrix.dockerfile }}
      cache_scope: ${{ matrix.component }}
      version: ${{ needs.config.outputs.version }}
      source_label: ${{ needs.config.outputs.source }}
      publish: true
      publish_manifest: false
      prepare_sentry_source_maps: ${{ matrix.component == 'hearth' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        KILN_GIT_REPO=${{ needs.config.outputs.repository }}
        KILN_IMAGE_SOURCE=${{ needs.config.outputs.source }}
        SENTRY_DSN=${{ vars.SENTRY_DSN }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.05' }}
        VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.05' }}
        SENTRY_SOURCEMAPS=${{ matrix.component == 'hearth' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && 'prepare' || '' }}

  sentry:
    name: Publish Sentry source maps
    needs: images
    if: vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Download prepared source maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-sentry-source-maps
          path: apps/web/dist

      - name: Download Sentry CLI
        id: sentry_cli
        continue-on-error: true
        env:
          SENTRY_CLI_SHA256: 3a4bbf2c0d06378d4e59b337647483751a0a2b1603db5fd4991847d0cfd6478c
          SENTRY_CLI_VERSION: 3.6.2
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output /tmp/sentry-cli \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  /tmp/sentry-cli" | sha256sum --check
          chmod +x /tmp/sentry-cli

      - name: Publish source maps
        if: steps.sentry_cli.outcome == 'success'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          /tmp/sentry-cli releases new \
            --project "$SENTRY_PROJECT" \
            "$GITHUB_SHA"
          /tmp/sentry-cli sourcemaps upload \
            --project "$SENTRY_PROJECT" \
            --release "$GITHUB_SHA" \
            apps/web/dist
          /tmp/sentry-cli releases finalize "$GITHUB_SHA"

  release:
    needs: [code, config, images]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KILN_VERSION: ${{ needs.config.outputs.version }}
        run: node scripts/release.mjs nightly

  cli:
    needs: release
    if: vars.NPM_PACKAGE != ''
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
