name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiln-release-line
  cancel-in-progress: false
  # Preserve pending promotions and main releases when more runs arrive.
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  code:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  config:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    uses: ./.github/workflows/release-config.yml
    with:
      resolve_release_line: true

  images:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hearth
            dockerfile: apps/web/Dockerfile
          - component: relay
            dockerfile: apps/relay/Dockerfile
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.component }}
      image: ${{ needs.config.outputs.prefix }}/${{ matrix.component }}
      dockerfile: ${{ matrix.dockerfile }}
      cache_scope: ${{ matrix.component }}
      version: ${{ needs.config.outputs.version }}
      source_label: ${{ needs.config.outputs.source }}
      publish: true
      publish_manifest: false
      prepare_sentry_source_maps: ${{ matrix.component == 'hearth' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        KILN_GIT_REPO=${{ needs.config.outputs.repository }}
        KILN_IMAGE_SOURCE=${{ needs.config.outputs.source }}
        SENTRY_DSN=${{ vars.SENTRY_DSN }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.05' }}
        VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.05' }}
        SENTRY_SOURCEMAPS=${{ matrix.component == 'hearth' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && 'prepare' || '' }}

  cli_build:
    needs: config
    uses: ./.github/workflows/build-cli.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.config.outputs.version }}

  sentry:
    name: Publish Sentry source maps
    needs: images
    if: vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Download prepared source maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-sentry-source-maps
          path: apps/web/dist

      - name: Download Sentry CLI
        id: sentry_cli
        continue-on-error: true
        env:
          SENTRY_CLI_SHA256: 13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6
          SENTRY_CLI_VERSION: 3.8.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output /tmp/sentry-cli \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  /tmp/sentry-cli" | sha256sum --check
          chmod +x /tmp/sentry-cli

      - name: Publish source maps
        if: steps.sentry_cli.outcome == 'success'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          /tmp/sentry-cli releases new \
            --project "$SENTRY_PROJECT" \
            "$GITHUB_SHA"
          /tmp/sentry-cli sourcemaps upload \
            --project "$SENTRY_PROJECT" \
            --release "$GITHUB_SHA" \
            apps/web/dist
          /tmp/sentry-cli releases finalize "$GITHUB_SHA"

  release:
    needs: [code, config, images]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KILN_VERSION: ${{ needs.config.outputs.version }}
        run: node scripts/release.mjs nightly

  cli:
    permissions:
      contents: write
      id-token: write
    needs: [release, cli_build]
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      prepared_sha: ${{ github.sha }}
