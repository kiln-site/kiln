name: Nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiln-release-line
  cancel-in-progress: false
  # Preserve pending promotions and main releases when more runs arrive.
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  code:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  config:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    uses: ./.github/workflows/release-config.yml
    with:
      resolve_release_line: true

  images:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hearth
            dockerfile: apps/web/Dockerfile
          - component: relay
            dockerfile: apps/relay/Dockerfile
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.component }}
      image: ${{ needs.config.outputs.prefix }}/${{ matrix.component }}
      dockerfile: ${{ matrix.dockerfile }}
      cache_scope: ${{ matrix.component }}
      version: ${{ needs.config.outputs.version }}
      source_label: ${{ needs.config.outputs.source }}
      publish: true
      publish_manifest: false
      build_args: |
        SOURCE_COMMIT=${{ github.sha }}
        KILN_GIT_REPO=${{ needs.config.outputs.repository }}
        KILN_IMAGE_SOURCE=${{ needs.config.outputs.source }}
        OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        OTEL_EXPORTER_OTLP_HEADERS=${{ vars.OTEL_EXPORTER_OTLP_HEADERS }}
        OTEL_LOGS_EXPORTER=${{ vars.OTEL_LOGS_EXPORTER }}
        OTEL_METRICS_EXPORTER=${{ vars.OTEL_METRICS_EXPORTER }}
        OTEL_RESOURCE_ATTRIBUTES=${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
        OTEL_TRACES_EXPORTER=${{ vars.OTEL_TRACES_EXPORTER }}
        OTEL_TRACES_SAMPLER_ARG=${{ vars.OTEL_TRACES_SAMPLER_ARG }}

  cli_build:
    needs: config
    uses: ./.github/workflows/build-cli.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.config.outputs.version }}

  release:
    needs: [code, config, images]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KILN_VERSION: ${{ needs.config.outputs.version }}
        run: node scripts/release.mjs nightly

  cli:
    permissions:
      contents: write
    needs: [release, cli_build]
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      prepared_sha: ${{ github.sha }}
