name: Publish CLI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Kiln release tag to publish or retry
        required: true
        type: string

concurrency:
  group: kiln-cli-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish CLI package
    if: vars.NPM_PACKAGE != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]{8}\.[0-9]{6})?$'
          gh release view "$REQUESTED_TAG" >/dev/null
          echo "source_ref=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          cache: false
          node-version-file: .node-version
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Configure npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build npm package
        env:
          KILN_VERSION: ${{ steps.release.outputs.version }}
          KILN_GIT_REPO: https://github.com/${{ github.repository }}
          KILN_CLI_PACKAGE: ${{ vars.NPM_PACKAGE }}
          KILN_CLI_DEFAULT_URL: ${{ vars.CLI_DEFAULT_URL }}
        run: vp run -F kiln-cli build:npm

      - name: Verify package contents
        run: |
          diff -ru \
            .agents/skills/kiln-cli \
            apps/cli/dist/npm/skills/kiln-cli
          npm pack --dry-run ./apps/cli/dist/npm

      - name: Check whether the version already exists
        id: published
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ vars.NPM_PACKAGE }}
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        run: npm publish ./apps/cli/dist/npm --access public --tag latest
