name: Publish CLI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prepared_sha:
        description: Source commit of CLI assets already built in this run
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Kiln release tag to publish or retry
        required: true
        type: string

concurrency:
  group: kiln-cli-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Resolve CLI release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.source_ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PREPARED_SHA: ${{ inputs.prepared_sha }}
        run: |
          printf '%s\n' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]{8}\.[0-9]{6})?$'
          gh release view "$REQUESTED_TAG" >/dev/null
          if [ -n "$PREPARED_SHA" ]; then
            test "$(git rev-list -n 1 "refs/tags/$REQUESTED_TAG")" = "$PREPARED_SHA"
          fi
          echo "source_ref=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish CLI packages
    needs: [release, binaries]
    # Nightlies supply assets from the parallel build; stable/manual runs build here.
    if: >-
      ${{ !cancelled() && needs.release.result == 'success'
          && (needs.binaries.result == 'success'
              || (inputs.prepared_sha != '' && needs.binaries.result == 'skipped')) }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Configure npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download CLI release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-assets-*
          merge-multiple: true
          path: apps/cli/dist/assets

      - name: Prepare native npm packages for publishing
        run: |
          mkdir -p apps/cli/dist/platform-packages
          cp apps/cli/dist/assets/*.tgz apps/cli/dist/platform-packages/

      - name: Build npm package
        env:
          KILN_VERSION: ${{ needs.release.outputs.version }}
          KILN_GIT_REPO: https://github.com/${{ github.repository }}
          KILN_CLI_PACKAGE: ${{ vars.NPM_PACKAGE }}
          KILN_CLI_DEFAULT_URL: ${{ vars.CLI_DEFAULT_URL }}
        run: node apps/cli/scripts/package.mjs

      - name: Verify package contents
        run: |
          diff -ru \
            .agents/skills/kiln-cli \
            apps/cli/dist/npm/skills/kiln-cli
          npm pack --dry-run ./apps/cli/dist/npm

      - name: Pack launcher and upload CLI release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p apps/cli/dist/assets
          npm pack ./apps/cli/dist/npm --pack-destination apps/cli/dist/assets
          gh release upload "$RELEASE_TAG" apps/cli/dist/assets/* --clobber

      - name: Publish native packages and launcher
        if: vars.NPM_PACKAGE != ''
        env:
          KILN_VERSION: ${{ needs.release.outputs.version }}
          KILN_GIT_REPO: https://github.com/${{ github.repository }}
          KILN_CLI_PACKAGE: ${{ vars.NPM_PACKAGE }}
        run: node apps/cli/scripts/publish.mjs

  binaries:
    if: inputs.prepared_sha == ''
    needs: release
    uses: ./.github/workflows/build-cli.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
