name: Desktop image

# The desktop streamer, which Relays pull the first time someone opens a node's
# desktop. It links x264, so it's distributed under the GPL, separately from
# Kiln's images, with its source published beside it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-image.yml"
      - ".github/workflows/reusable-image.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-image.yml"
      - ".github/workflows/reusable-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: desktop-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    uses: ./.github/workflows/release-config.yml

  version:
    name: Read the image's tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read it from the Dockerfile
        id: version
        run: |
          voxl="$(sed -n 's/^ARG VOXL_VERSION=//p' apps/desktop/Dockerfile)"
          revision="$(sed -n 's/^ARG DESKTOP_IMAGE_REVISION=//p' apps/desktop/Dockerfile)"
          test -n "$voxl" && test -n "$revision"
          echo "tag=$voxl-$revision" >> "$GITHUB_OUTPUT"

  image:
    needs: [config, version]
    name: Streamer
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Desktop streamer
      image: ${{ needs.config.outputs.prefix }}/desktop
      dockerfile: apps/desktop/Dockerfile
      # Each publish takes the digests its scope starts with, so neither of this
      # workflow's scopes can start with the other.
      cache_scope: desktop-streamer
      license_label: GPL-2.0-or-later
      tags: type=raw,value=${{ needs.version.outputs.tag }}
      # Only main replaces what Relays pull, whatever a manual run's branch.
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_IMAGES == 'true' }}
      publish_provenance: mode=max
      publish_sbom: true

  source:
    needs: [config, version]
    name: Source
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: Desktop streamer source
      image: ${{ needs.config.outputs.prefix }}/desktop
      dockerfile: apps/desktop/Dockerfile
      target: source
      cache_scope: desktop-source
      architectures: '["amd64"]'
      build_args: |
        KILN_GIT_REPO=${{ needs.config.outputs.repository }}
        SOURCE_COMMIT=${{ github.sha }}
      license_label: GPL-2.0-or-later
      tags: type=raw,value=${{ needs.version.outputs.tag }}-source
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_IMAGES == 'true' }}
