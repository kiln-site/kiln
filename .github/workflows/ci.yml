name: Code checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    services:
      # Backs the opt-in MySQL access migration fixture; unit tests ignore it.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kiln_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks
            command: |
              vp run -r typecheck
              vp check
          - name: Tests
            command: |
              ACCESS_MIGRATION_TEST=1 DB_HOST=127.0.0.1 DB_PORT=3306 \
                DB_NAME=kiln_migration_test DB_USERNAME=root DB_PASSWORD=root \
                pnpm test
          - name: Build
            command: |
              vp run -r build
              git diff --exit-code -- apps/web/src/routeTree.gen.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          cache: true
          node-version-file: .node-version
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
