name: Code checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    services:
      # Backs the real-MySQL suites (apps/web/src/test/database.ts).
      mysql:
        image: ${{ matrix.name == 'Tests' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kiln_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks
            command: |
              vp run -r typecheck
              vp check
          - name: Tests
            # Root "test" script: every package's test task plus scripts/ tests.
            command: |
              KILN_TEST_MYSQL=1 DB_HOST=127.0.0.1 DB_PORT=3306 \
                DB_NAME=kiln_test DB_USERNAME=root DB_PASSWORD=root \
                vp run test
          - name: Build
            command: |
              vp run -r build
              git diff --exit-code -- apps/web/src/routeTree.gen.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          node-version-file: .node-version
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
