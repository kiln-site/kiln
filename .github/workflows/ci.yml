name: Code checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks
            command: |
              vp run -r typecheck
              vp check
          - name: Tests
            # Every package's test task except Hearth's, plus scripts/ tests.
            # The root package is excluded too: its own "test" script runs
            # every package, Hearth included.
            command: |
              vp run --filter '!web' --filter '!kiln' test
              vp test run
          - name: Hearth tests
            # Runs alone so its import-heavy suite gets the whole runner.
            mysql: true
            command: |
              KILN_TEST_MYSQL=1 DB_HOST=127.0.0.1 DB_PORT=3306 \
                DB_NAME=kiln_test DB_USERNAME=root DB_PASSWORD=root \
                vp run --filter web test
          - name: Build
            # vp fails a task when it can't forward its output fast enough
            # ("Resource temporarily unavailable"), which the web build's
            # long asset list sometimes trips. A file always takes it.
            command: |
              status=0
              vp run -r build > "$RUNNER_TEMP/build.log" 2>&1 || status=$?
              cat "$RUNNER_TEMP/build.log"
              test "$status" -eq 0
              git diff --exit-code -- apps/web/src/routeTree.gen.ts
    steps:
      # Backs the real-MySQL suites (apps/web/src/test/database.ts). Pulled
      # and booted in the background while the job sets up. The data is
      # disposable, so it lives in memory without binlogs or flushes.
      - name: Start MySQL
        if: matrix.mysql
        run: |
          docker run --detach --name mysql --tmpfs /var/lib/mysql \
            --publish 127.0.0.1:3306:3306 \
            --env MYSQL_ROOT_PASSWORD=root --env MYSQL_DATABASE=kiln_test \
            mysql:8.4 --skip-log-bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 > "$RUNNER_TEMP/mysql.log" 2>&1 &

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          node-version-file: .node-version
          run-install: |
            - cwd: .
              args: ["--frozen-lockfile"]

      - name: Wait for MySQL
        if: matrix.mysql
        run: |
          timeout 120 sh -c 'until docker exec mysql \
            mysqladmin ping -h 127.0.0.1 -proot --silent; do sleep 1; done' ||
            { cat "$RUNNER_TEMP/mysql.log"; docker logs mysql; exit 1; }

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
