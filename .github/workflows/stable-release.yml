name: Stable release

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Nightly version to promote, without the leading v
        required: true
        type: string
      next_release:
        description: Next stable version for future nightlies (for example 0.2.0)
        required: true
        type: string

concurrency:
  group: kiln-release-line
  cancel-in-progress: false
  # Preserve pending promotions and main releases when more runs arrive.
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
          NEXT_RELEASE: ${{ inputs.next_release }}
        run: node scripts/release.mjs stable

  cli:
    permissions:
      contents: write
      id-token: write
    needs: promote
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
