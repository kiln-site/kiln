name: Stable release

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Nightly version to promote, without the leading v
        required: true
        type: string
      next_release:
        description: Next stable version for future nightlies (for example 0.2.0)
        required: true
        type: string

concurrency:
  group: kiln-release-line
  cancel-in-progress: false
  # Preserve pending promotions and main releases when more runs arrive.
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
          NEXT_RELEASE: ${{ inputs.next_release }}
        run: node scripts/release.mjs stable

  cli:
    permissions:
      contents: read
      id-token: write
    needs: promote
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
