name: Reusable container image

on:
  workflow_call:
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.publish.outputs.digest }}
    inputs:
      name:
        description: Human-readable component name
        required: true
        type: string
      image:
        description: Fully qualified container image name
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string
      cache_scope:
        description: Stable cache and artifact prefix
        required: true
        type: string
      architectures:
        description: JSON array of architectures published in the image manifest
        required: false
        type: string
        default: '["amd64", "arm64"]'
      build_args:
        description: Newline-delimited Docker build arguments
        required: false
        type: string
        default: ""
      tags:
        description: Newline-delimited docker/metadata-action tag rules
        required: false
        type: string
        default: |
          type=sha,prefix=sha-
      source_label:
        description: Explicit org.opencontainers.image.source override
        required: false
        type: string
        default: ""
      publish_manifest:
        description: Whether this workflow should publish the multi-platform manifest
        required: false
        type: boolean
        default: true
      publish:
        description: Publish release images and manifests
        type: boolean
        default: false
      version:
        description: Version embedded in the image
        type: string
        default: ""
      prepare_sentry_source_maps:
        description: Export source maps from the exact amd64 image build
        required: false
        type: boolean
        default: false
      publish_provenance:
        description: Provenance mode used for published images
        required: false
        type: string
        default: mode=min
      publish_sbom:
        description: Whether published images include an SBOM attestation
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ inputs.name }}${{ matrix.architecture == 'arm64' && ' · arm64' || '' }}
    # Repository variables opt push builds into a preferred runner provider.
    runs-on: >-
      ${{ matrix.architecture == 'arm64'
          && (github.event_name == 'push' && vars.BUILD_RUNNER_ARM64 || 'ubuntu-24.04-arm')
          || (github.event_name == 'push' && vars.BUILD_RUNNER_AMD64 || 'ubuntu-24.04') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architectures) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve build cache
        id: cache
        env:
          IMAGE: ${{ inputs.image }}
          CACHE_SCOPE: ${{ inputs.cache_scope }}
          ARCHITECTURE: ${{ matrix.architecture }}
          WRITE_CACHE: >-
            ${{ vars.PUBLISH_IMAGES == 'true'
                && github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name == github.repository
                && github.actor != 'dependabot[bot]' }}
        run: |
          echo "ref=${IMAGE%/*}/${CACHE_SCOPE}-build-cache:${ARCHITECTURE}" >> "$GITHUB_OUTPUT"
          echo "write=$WRITE_CACHE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: inputs.publish || steps.cache.outputs.write == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          flavor: latest=false
          tags: |
            ${{ inputs.tags }}
          labels: |
            ${{ inputs.source_label && format('org.opencontainers.image.source={0}', inputs.source_label) || '' }}
            ${{ inputs.version && format('org.opencontainers.image.version={0}', inputs.version) || '' }}

      - name: Verify release version label
        if: inputs.version != ''
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          # The updater validates this label against the release manifest.
          jq --exit-status --arg version "$EXPECTED_VERSION" \
            '.labels["org.opencontainers.image.version"] == $version' <<< "$METADATA"

      - name: Prepare Sentry source maps
        if: inputs.publish && inputs.prepare_sentry_source_maps && matrix.architecture == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: sentry-source-maps
          build-args: |
            ${{ inputs.build_args }}
            KILN_VERSION=${{ inputs.version }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=local,dest=/tmp/sentry-source-maps
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          provenance: false
          sbom: false

      - name: Build${{ inputs.publish && ' and publish' || '' }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            ${{ inputs.build_args }}
            KILN_VERSION=${{ inputs.version }}
          platforms: linux/${{ matrix.architecture }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Same-repository PRs refresh the shared cache. Release builds only
          # import it so publishing does not wait for a cache upload.
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ steps.cache.outputs.write == 'true' && format('type=registry,ref={0},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd', steps.cache.outputs.ref) || '' }}
          provenance: ${{ inputs.publish && inputs.publish_provenance || 'false' }}
          sbom: ${{ inputs.publish && inputs.publish_sbom }}

      - name: Export image digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.cache_scope }}-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload prepared Sentry source maps
        if: inputs.publish && inputs.prepare_sentry_source_maps && matrix.architecture == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-sentry-source-maps
          path: |
            /tmp/sentry-source-maps/**/*.js
            /tmp/sentry-source-maps/**/*.mjs
            /tmp/sentry-source-maps/**/*.map
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  publish:
    name: Publish ${{ inputs.name }} manifest
    if: inputs.publish && inputs.publish_manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ inputs.cache_scope }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          flavor: latest=false
          tags: ${{ inputs.tags }}

      - name: Create and verify multi-platform manifest
        id: manifest
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          IMAGE: ${{ inputs.image }}
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          test "${#tags[@]}" -gt 0

          expected_architectures="$(jq 'length' <<< "$ARCHITECTURES")"
          test "$expected_architectures" -gt 0

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq "$expected_architectures"

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          digest="sha256:$(docker buildx imagetools inspect "${tags[0]}" --raw | sha256sum | awk '{print $1}')"
          test "${#digest}" -eq 71
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
