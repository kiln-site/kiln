name: Container images

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  config:
    uses: ./.github/workflows/release-config.yml

  images:
    needs: config
    name: ${{ matrix.name }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hearth
            image: hearth
            dockerfile: apps/web/Dockerfile
            cache_scope: hearth
            build_args: |
              SOURCE_COMMIT=${{ github.sha }}
              VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
              VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.05' }}
              VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0.05' }}
          - name: Relay
            image: relay
            dockerfile: apps/relay/Dockerfile
            cache_scope: relay
            build_args: |
              SOURCE_COMMIT=${{ github.sha }}
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      image: ${{ needs.config.outputs.prefix }}/${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      cache_scope: ${{ matrix.cache_scope }}
      build_args: |
        ${{ matrix.build_args }}
        KILN_GIT_REPO=${{ needs.config.outputs.repository }}
        KILN_IMAGE_SOURCE=${{ needs.config.outputs.source }}
      version: ${{ needs.config.outputs.version }}
      source_label: ${{ needs.config.outputs.source }}
      tags: |
        type=sha,prefix=sha-
